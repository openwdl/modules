#:schema https://raw.githubusercontent.com/stjude-rust-labs/sprocket/v0.28.0/jsonschemas/sprocket.toml.json

[format]
indent = 4
max_line_length = 90
sort_imports = true
sort_inputs = false
trailing_commas = true
newline_style = "unix"

[check]
deny_warnings = true
deny_notes = true
all_lint_rules = true
except = ["MetaSections"]

[check.lint]
bash_set_options = ["errexit", "nounset", "pipefail"]

[test]
parallelism = 4

[doc]
with_doc_comments = true

[common.wdl.feature_flags]
wdl_1_3 = true
wdl_1_4 = true
